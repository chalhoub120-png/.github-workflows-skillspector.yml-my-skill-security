name: SkillSpector Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Default to read-only repository access.
permissions:
  contents: read

jobs:
  # Untrusted pull-request code is scanned without exposing API credentials.
  static-pr-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and SkillSpector
        run: |
          python -m pip install --upgrade uv
          uv tool install git+https://github.com/NVIDIA/skillspector.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run static security scan (no API credentials)
        run: |
          skillspector scan ./ --no-llm --fail-on-incomplete

  # LLM analysis runs only on trusted main-branch pushes or manual runs on main.
  llm-main-scan:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and SkillSpector
        run: |
          python -m pip install --upgrade uv
          uv tool install git+https://github.com/NVIDIA/skillspector.git
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run SkillSpector Claude AI security scan
        env:
          SKILLSPECTOR_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          skillspector scan ./ --fail-on-incomplete
