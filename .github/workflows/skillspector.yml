name: SkillSpector Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # يتيح لك زر تشغيل يدوي بسيط متى ما رغبت في أي وقت

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & SkillSpector
        run: |
          pip install uv
          python -m uv tool install git+https://github.com/nvidia/skillspector.git

      - name: Run SkillSpector Flexible Scan
        env:
          SKILLSPECTOR_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # فحص بسيط ومباشر مع تخطي الأخطاء لضمان استمرار عمل المشروع بسلاسة
          ~/.local/bin/skillspector scan ./ || true
