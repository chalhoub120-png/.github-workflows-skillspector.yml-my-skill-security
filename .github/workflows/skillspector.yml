name: SkillSpector Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & SkillSpector
        run: |
          pip install uv
          uv tool install git+https://github.com/nvidia/skillspector.git

      - name: Run SkillSpector Static Scan
        run: |
          skillspector scan ./ --no-llm --fail-on-findings
