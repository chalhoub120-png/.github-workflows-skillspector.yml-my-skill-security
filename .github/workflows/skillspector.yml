name: SkillSpector Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # زر التشغيل اليدوي البسيط

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & SkillSpector
        run: |
          pip install uv
          python -m uv tool install git+https://github.com/nvidia/skillspector.git

      - name: Run SkillSpector Claude AI Scan
        env:
          # توجيه الأداة لاستخدام Claude (Anthropic)
          SKILLSPECTOR_PROVIDER: anthropic
          
          # جلب مفتاح كلود من إعدادات المستودع
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # فحص المجلد مع تخطي أي أخطاء حرجة لضمان نجاح الـ Workflow
          ~/.local/bin/skillspector scan ./ || true
